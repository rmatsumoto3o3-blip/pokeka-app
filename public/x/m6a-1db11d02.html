<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
</head><body>
<title>30th CELEBRATION 買い時ひとめ表</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--ink:#0f172a;--ink2:#64748b;--line:#e2e8f0;--em:#059669;--accent:#dc2626;--amber:#d97706;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Hiragino Kaku Gothic ProN",sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:19px;margin:0 0 6px}
.how{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:11px 13px;font-size:13px;margin:6px 0 10px;line-height:1.7}
.how b{color:#064e3b}
.warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:8px;padding:8px 12px;font-size:12px;margin:0 0 14px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
label{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.chip{display:inline-block;font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:6px}
.c-buy{background:var(--em)}.c-wait{background:var(--accent)}.c-soon{background:var(--amber)}.c-na{background:var(--ink2)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:900px}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right;white-space:nowrap;vertical-align:middle}
th{background:#f8fafc;color:var(--ink2);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left;white-space:normal}
tr:last-child td{border-bottom:none}
.nm{font-weight:700}.rar{font-size:11px;color:var(--ink2)}
.sub{font-size:11px;color:var(--ink2)}
.best{font-weight:800;color:var(--em)}
.so{color:var(--accent);font-weight:700}
.stk{font-weight:700}.stk.hi{color:var(--accent)}.stk.lo{color:var(--em)}.stk.no{color:var(--ink2)}
.down{color:var(--accent);font-weight:700}
.spark{display:block}
tr.main{cursor:pointer}
tr.main:hover{background:#f8fafc}
.arw{display:inline-block;width:12px;color:var(--ink2);transition:transform .15s;font-size:11px}
tr.main.open .arw{transform:rotate(90deg)}
tr.det>td{background:#f8fafc;padding:12px 14px}
.hbox{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.hlabel{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.hist{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
@media (max-width:680px){
  .tblwrap{overflow-x:visible}
  table{min-width:0;border:none;background:transparent;border-radius:0}
  tr.hd{display:none}
  tr.main{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:9px}
  tr.main td{border:none!important;padding:2px 0;text-align:left;white-space:normal;display:flex;align-items:baseline;gap:5px}
  tr.main td[data-label]::before{content:attr(data-label);color:var(--ink2);font-size:11px;flex:0 0 auto}
  td.cnm{grid-column:1/-1;padding-bottom:4px;border-bottom:1px solid var(--line)!important;margin-bottom:3px}
  td.cspark{grid-column:1/-1;flex-direction:column;align-items:flex-start}
  td[data-label="予想レンジ"]{grid-column:1/-1}
  td.cjudge{grid-column:1/-1;justify-content:flex-start;margin-top:3px}
  tr.det:not([hidden]){display:block;margin:-6px 0 9px}
  tr.det>td{display:block;width:auto;padding:12px!important;border-radius:0 0 10px 10px}
  .hbox{flex-direction:column;gap:14px}
  .hist{width:100%;max-width:300px}
}
</style>

<div class="wrap">
  <h1>30th CELEBRATION 「今、買い時か」ひとめ表</h1>
  <div class="warn">⚠ 確定した予測ではなく、ネット上の相場傾向から今後の動きを推定した“目安”です。大会結果・在庫・再録などで実際は変わります。価格は2026/9/18時点。</div>

  <div class="ctrl">
    <label>並び替え<select id="sort">
      <option value="phi" selected>価格 高い</option>
      <option value="plo">価格 安い</option>
      <option value="dhi">下落見込み ▲（大きい）</option>
      <option value="dlo">下落見込み ▼（小さい）</option>
      <option value="buy">おすすめ（買い寄り順）</option>
    </select></label>
  </div>
  <div class="tblwrap"><div id="tbl"></div></div>
</div>

<script>
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
// cr=A店 / dr=B店 / hr=C店。crst/hrst=在庫(0=売切,null=不明)、drso/hrso=SOLDOUT
const CARDS=[
 {n:"ミュウ R/RGB",no:"R",tier:"RGB",cr:648000,crst:1,dr:600000,drso:false,hr:700000,hrst:1,hrso:false,hold:'H'},
 {n:"ミュウ G/RGB",no:"G",tier:"RGB",cr:448000,crst:1,dr:500000,drso:false,hr:450000,hrst:1,hrso:false,hold:'H'},
 {n:"ミュウ B/RGB",no:"B",tier:"RGB",cr:548000,crst:1,dr:500000,drso:false,hr:550000,hrst:0,hrso:true,hold:'H'},
 {n:"ミュウex FUR",no:"135",tier:"FUR",cr:14800,crst:81,dr:16000,drso:false,hr:16000,hrst:27,hrso:false,hold:'H'},
 {n:"ミュウツーex FUR",no:"134",tier:"FUR",cr:11800,crst:134,dr:10000,drso:false,hr:12000,hrst:29,hrso:false,hold:'H'},
 {n:"ブラッキーex SAR仕様",no:"044",tier:"MF",cr:12800,crst:3,dr:null,drso:false,hr:null,hrst:null,hrso:false,hold:'H'},
 {n:"エーフィex SAR仕様",no:"043",tier:"MF",cr:6980,crst:18,dr:null,drso:false,hr:null,hrst:null,hrso:false,hold:'M'},
 {n:"ピカチュウex (127)",no:"127",tier:"SAR",cr:13800,crst:76,dr:12000,drso:false,hr:12000,hrst:0,hrso:true,hold:'H'},
 {n:"ピカチュウex (126)",no:"126",tier:"SAR",cr:12800,crst:139,dr:10000,drso:false,hr:11000,hrst:22,hrso:false,hold:'H'},
 {n:"ミュウex (129)",no:"129",tier:"SAR",cr:9480,crst:null,dr:10000,drso:false,hr:9000,hrst:0,hrso:true,hold:'M'},
 {n:"ゲンガーex (131)",no:"131",tier:"SAR",cr:6480,crst:145,dr:6500,drso:false,hr:7500,hrst:0,hrso:true,hold:'M'},
 {n:"ミュウツーex (128)",no:"128",tier:"SAR",cr:4480,crst:129,dr:5000,drso:false,hr:6000,hrst:25,hrso:false,hold:'M'},
 {n:"ニンフィアex (130)",no:"130",tier:"SAR",cr:4480,crst:142,dr:5000,drso:false,hr:5500,hrst:8,hrso:false,hold:'M'},
 {n:"ジラーチex (132)",no:"132",tier:"SAR",cr:3280,crst:198,dr:4000,drso:false,hr:4000,hrst:0,hrso:true,hold:'M'},
 {n:"ゲッコウガex (125)",no:"125",tier:"SAR",cr:2180,crst:112,dr:2500,drso:false,hr:3000,hrst:39,hrso:false,hold:'L'},
 {n:"ボーマンダex (133)",no:"133",tier:"SAR",cr:1080,crst:108,dr:1200,drso:false,hr:1400,hrst:46,hrso:false,hold:'L'},
 {n:"ホゲータex (124)",no:"124",tier:"SAR",cr:1080,crst:56,dr:1000,drso:false,hr:1500,hrst:6,hrso:false,hold:'L'},
 {n:"リザードン LV.76",no:"137",tier:"復刻",cr:21800,crst:0,dr:null,drso:false,hr:18000,hrst:0,hrso:true,hold:'H'},
 {n:"ルギア（クリスタル）",no:"142",tier:"復刻",cr:25800,crst:0,dr:null,drso:false,hr:20000,hrst:0,hrso:true,hold:'H'},
 {n:"コイキング",no:"165",tier:"復刻",cr:6980,crst:136,dr:null,drso:false,hr:7000,hrst:0,hrso:true,hold:'M'},
 {n:"ゲンガー（グレート）",no:"150",tier:"復刻",cr:6480,crst:134,dr:null,drso:false,hr:7000,hrst:0,hrso:true,hold:'M'},
 {n:"ダークライ&クレセリアLEGEND(上下)",no:"151+152",tier:"復刻",cr:3980,crst:153,dr:null,drso:false,hr:4400,hrst:32,hrso:false,hold:'M'},
 {n:"ピカチュウ LV.12",no:"136",tier:"復刻",cr:4980,crst:0,dr:null,drso:false,hr:3700,hrst:0,hrso:true,hold:'M'},
 {n:"ひかるセレビィ LV.18",no:"141",tier:"復刻",cr:3280,crst:0,dr:null,drso:false,hr:2800,hrst:0,hrso:true,hold:'M'},
 {n:"わるいバンギラス",no:"144",tier:"復刻",cr:1480,crst:0,dr:null,drso:false,hr:1800,hrst:0,hrso:true,hold:'L'},
 {n:"ミュウVMAX",no:"163",tier:"復刻",cr:1480,crst:109,dr:null,drso:false,hr:2000,hrst:2,hrso:false,hold:'L'},
 {n:"レックウザEX",no:"154",tier:"復刻",cr:2180,crst:54,dr:null,drso:false,hr:2000,hrst:0,hrso:true,hold:'L'},
 {n:"N",no:"153",tier:"復刻",cr:1580,crst:186,dr:null,drso:false,hr:2000,hrst:19,hrso:false,hold:'L'},
 {n:"ピカチュウ&ゼクロムGX",no:"160",tier:"復刻",cr:1780,crst:9,dr:null,drso:false,hr:1600,hrst:0,hrso:true,hold:'L'},
 {n:"カスミ",no:"138",tier:"復刻",cr:1080,crst:172,dr:null,drso:false,hr:1000,hrst:20,hrso:false,hold:'L'},
 {n:"パルキアLV.X",no:"147",tier:"復刻",cr:880,crst:184,dr:null,drso:false,hr:1100,hrst:27,hrso:false,hold:'L'},
 {n:"ハッサムex",no:"145",tier:"復刻",cr:880,crst:226,dr:null,drso:false,hr:1100,hrst:7,hrso:false,hold:'L'},
];
// 価格を記録した時点ごとの「最安値」履歴（キー=no）。更新のたびにここへ日付と最安値を追記していく。今日ぶんは自動で末尾に付く。
const DATES=["9/16","9/17"];        // 過去に記録した日付（古い順）。今日は自動追加。
const TODAY="9/18";
const PAST={ // no: [DATES順の最安値]
 "R":[750000,700000],"G":[500000,450000],"135":[18000,17800],"134":[12000,12000],"044":[13800,13800],"043":[8980,8980],
 "127":[12000,11800],"126":[10000,10000],"129":[9000,9000],"131":[6000,6000],"128":[5000,5000],"130":[5000,5000],
 "132":[4000,4000],"125":[2500,2500],"133":[1200,1200],"124":[1000,1000],"137":[16000,16000],"142":[14000,15000],
 "165":[7500,6980],"150":[7000,6480],"151+152":[5600,5000],"136":[3800,3500],"141":[3300,2800],"144":[2000,1780],
 "163":[2000,1780],"154":[2000,2000],"153":[2000,2000],"160":[1800,1500],"138":[1500,1300],"147":[1100,1080],"145":[1100,1080]
};
// D店 価格指標。no:[価格, 在庫]（◎＝豊富→50, 数字＝実数, 空欄＝不明null）
const HB={
 "R":[698000,null],"B":[548000,null],"G":[448000,null],
 "135":[14800,50],"134":[11800,50],"142":[25800,null],"137":[21800,null],
 "127":[13800,50],"126":[12800,3],"129":[9480,50],"150":[6980,null],"165":[6480,50],"131":[6480,50],
 "136":[4980,null],"130":[4480,50],"128":[4480,50],"141":[3280,null],"132":[3280,50],"151+152":[4560,50],
 "125":[2180,50],"160":[1980,null],"154":[1980,50],"163":[1780,50],"144":[1780,3],"153":[1580,50],
 "138":[1380,50],"133":[1080,50],"124":[1080,50],"147":[880,50],"145":[880,50]
};
function histChart(series){
  if(!series.length) return '<div class="sub">価格の記録がまだありません</div>';
  const W=280,H=96,pl=8,pr=8,pt=18,pb=20,n=series.length;
  const vals=series.map(s=>s[1]),max=Math.max(...vals),min=Math.min(...vals),span=(max-min)||max||1;
  const x=i=>n===1?W/2:pl+(W-pl-pr)*(i/(n-1));
  const y=v=>pt+(H-pt-pb)*(1-(v-min)/span);
  const ta=i=>n===1?'middle':(i===0?'start':(i===n-1?'end':'middle'));
  let svg='<svg class="hist" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  if(n>1){const up=series[n-1][1]>=series[0][1];
    svg+='<polyline points="'+series.map((s,i)=>x(i).toFixed(1)+','+y(s[1]).toFixed(1)).join(' ')+'" fill="none" stroke="'+(up?'#dc2626':'#059669')+'" stroke-width="2"/>';}
  series.forEach((s,i)=>{
    svg+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(s[1]).toFixed(1)+'" r="3" fill="#0f172a"/>'+
      '<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" font-size="10" fill="#64748b" text-anchor="'+ta(i)+'">'+s[0]+'</text>'+
      '<text x="'+x(i).toFixed(1)+'" y="'+(y(s[1])-6).toFixed(1)+'" font-size="10" fill="#0f172a" text-anchor="'+ta(i)+'">'+yen(s[1])+'</text>';
  });
  svg+='</svg>';
  if(n>1){const d=series[n-1][1]-series[0][1],p=d/series[0][1]*100;
    return svg+'<div class="sub" style="color:'+(d<=0?'var(--em)':'var(--accent)')+'">記録期間の変化 '+(d>0?'+':'')+yen(d)+'（'+(p>0?'+':'')+p.toFixed(0)+'%）</div>';}
  return svg+'<div class="sub">記録が1点のみ。更新するたびに履歴が増えていきます。</div>';
}
const HOLDMUL={H:1.28,M:1.0,L:0.84};
function supplyMul(s){ if(s==null)return 1.0; if(s===0)return 1.12; if(s<20)return 1.12; if(s<80)return 1.03; if(s<160)return .95; return .88; }
// 上昇シナリオ：参考弾SARの再上昇幅を根拠にした「上値の伸びしろ%」。品薄ほど上がりやすい
const UPBASE={H:0.38,M:0.24,L:0.12};
function upSupply(s){ if(s==null)return 1.0; if(s===0)return 1.3; if(s<20)return 1.3; if(s<80)return 1.05; if(s<160)return .85; return .7; }
function spark(price,floor,ceil,hold){
  const W=140,H=44,DAYS=90,pad=4,tau=13;
  const dn=d=>floor+(price-floor)*Math.exp(-d/tau)+(price-floor)*0.05*Math.sin(d/8);       // 下落シナリオ
  const up=d=>price+(ceil-price)*(1-Math.exp(-d/16));                                        // 上昇シナリオ（再上昇→頭打ち）
  const dpts=[],upts=[];for(let d=0;d<=DAYS;d+=3){dpts.push([d,Math.max(floor*0.9,dn(d))]);upts.push([d,up(d)]);}
  dpts[0][1]=price;upts[0][1]=price;
  const top=ceil*1.03, bot=floor*0.9;
  const x=d=>pad+(W-2*pad)*(d/DAYS),y=v=>H-pad-(H-2*pad)*((v-bot)/((top-bot)||1));
  const dline=dpts.map(p=>`${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  const uline=upts.map(p=>`${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  const poly=upts.map(p=>`${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ')+' '+dpts.slice().reverse().map(p=>`${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`+
    `<polygon points="${poly}" fill="#94a3b8" opacity="0.14"/>`+
    `<polyline points="${uline}" fill="none" stroke="#059669" stroke-width="1.6"/>`+
    `<polyline points="${dline}" fill="none" stroke="#dc2626" stroke-width="1.6"/>`+
    `<circle cx="${x(0).toFixed(1)}" cy="${y(price).toFixed(1)}" r="2.6" fill="#0f172a"/>`+
    `</svg><div class="sub">今 → 3ヶ月後（<span style="color:#059669">上昇</span>〜<span style="color:#dc2626">下落</span>）</div>`;
}
function calc(){
  const base=48;
  let rows=CARDS.map(c=>{
    const hb=HB[c.no]||null; const hbp=hb?hb[0]:null, hbst=hb?hb[1]:null;
    const opt=[];
    if(c.cr!=null&&c.crst!==0)opt.push(['cr',c.cr,c.crst]);
    if(c.dr!=null&&!c.drso)opt.push(['dr',c.dr,null]);
    if(c.hr!=null&&c.hrst!==0&&!c.hrso)opt.push(['hr',c.hr,c.hrst]);
    if(hbp!=null&&hbst!==0)opt.push(['hb',hbp,hbst]);
    let best=null;opt.forEach(o=>{if(!best||o[1]<best[1])best=o;});
    const avail=!!best, price=avail?best[1]:(c.cr||c.hr||c.dr||hbp||0);
    const _stk=[c.crst,c.hrst,hbst].filter(x=>x!=null); const stockRep=_stk.length?Math.max(..._stk):null; // 市場の供給量＝全店の最大在庫
    const fpct=Math.max(28,Math.min(82,base*HOLDMUL[c.hold]*supplyMul(stockRep)));
    const floor=Math.round(price*fpct/100/10)*10, drop=(price-floor)/price*100;
    const upPct=Math.max(0.04,Math.min(0.9,UPBASE[c.hold]*upSupply(stockRep)));
    const ceil=Math.round(price*(1+upPct)/10)*10, rise=upPct*100;
    // 判定：待てば下がる(下落余地)か、待つと上がる/売り切れる(上昇余地・品薄)かの綱引き。新弾は基本“待ちが得”
    let lvl,label; const scarce=(stockRep!=null&&stockRep<=5), net=rise-drop;
    if(!avail){lvl='na';label='売切';}
    else if(net>=2||scarce){lvl='buy';label='今でも可';}
    else if(net>=-22){lvl='soon';label='様子見';}
    else{lvl='wait';label='待ちが得';}
    return {...c,hbp,hbst,best,avail,price,stockRep,floor,fpct,drop,ceil,rise,lvl,label};
  });
  const sort=document.getElementById('sort').value, ord={buy:0,soon:1,wait:2,na:3};
  rows.sort((a,b)=> sort==='phi'?b.price-a.price : sort==='plo'?a.price-b.price : sort==='dhi'?b.drop-a.drop : sort==='dlo'?a.drop-b.drop : (ord[a.lvl]-ord[b.lvl])||b.price-a.price);
  const cell=(val,soldout,isBest)=> val==null?'<span class="sub">—</span>' : soldout?'<span class="so">売切</span>' : `<span class="${isBest?'best':''}">${yen(val)}</span>`;
  document.getElementById('tbl').innerHTML=`<table><tr class="hd">
    <th>カード</th><th>A店</th><th>B店</th><th>C店</th><th>D店</th><th>在庫</th><th>今後の予測推移</th><th>予想レンジ<br><span class="sub">上昇／下落</span></th><th>判定</th></tr>`+
    rows.map((r,i)=>{
      const bs=r.best?r.best[0]:'', s=r.stockRep;
      const stk=s==null?`<span class="stk no">?</span>`:s===0?`<span class="stk hi">売切</span>`:`<span class="stk ${s<40?'lo':s>150?'hi':''}">${s}</span>`;
      // 実測の価格履歴：過去の記録＋今日の最安値
      const pastArr=PAST[r.no]||[]; const series=DATES.map((d,k)=>[d,pastArr[k]]).filter(p=>p[1]!=null);
      if(r.avail)series.push([TODAY,r.price]);
      return `<tr class="main" data-i="${i}">
        <td class="cnm"><span class="arw">▶</span> <span class="nm">${r.n}</span> <span class="rar">${r.tier}・${r.no}</span></td>
        <td data-label="A店">${cell(r.cr,r.crst===0,bs==='cr')}</td>
        <td data-label="B店">${cell(r.dr,r.drso,bs==='dr')}</td>
        <td data-label="C店">${cell(r.hr,r.hrso||r.hrst===0,bs==='hr')}</td>
        <td data-label="D店">${cell(r.hbp,r.hbst===0,bs==='hb')}</td>
        <td data-label="在庫">${stk}</td>
        <td class="cspark" data-label="予測推移" style="text-align:left">${r.avail?spark(r.price,r.floor,r.ceil,r.hold):'<span class="sub">—</span>'}</td>
        <td data-label="予想レンジ">${r.avail?`<div style="color:#059669;font-weight:700">▲${yen(r.ceil)}<span class="sub" style="color:#059669"> +${r.rise.toFixed(0)}%</span></div><div class="down">▼${yen(r.floor)}<span class="sub" style="color:var(--accent)"> -${r.drop.toFixed(0)}%</span></div>`:'—'}</td>
        <td class="cjudge" data-label="判定"><span class="chip c-${r.lvl}">${r.label}</span></td>
      </tr>
      <tr class="det" data-i="${i}" hidden><td colspan="9"><div class="hbox">
        <div><div class="hlabel">価格の推移（記録した時点ごとの最安値）</div>${histChart(series)}</div>
        <div><div class="hlabel">現在の価格（各店）</div>
          <div class="sub">A店：${r.cr!=null?(r.crst===0?'売切':yen(r.cr)):'—'}</div>
          <div class="sub">B店：${r.dr!=null?(r.drso?'売切':yen(r.dr)):'—'}</div>
          <div class="sub">C店：${r.hr!=null?((r.hrso||r.hrst===0)?'売切':yen(r.hr)):'—'}</div>
          <div class="sub">D店：${r.hbp!=null?(r.hbst===0?'売切':yen(r.hbp)):'—'}</div>
          ${r.avail?`<div class="sub" style="margin-top:6px">今後の予想レンジ：<span style="color:#059669">▲${yen(r.ceil)}</span> 〜 <span style="color:var(--accent)">▼${yen(r.floor)}</span></div>`:''}
        </div>
      </div></td></tr>`;
    }).join('')+`</table>`;
}
['sort'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
document.getElementById('tbl').addEventListener('click',e=>{
  const tr=e.target.closest('tr.main'); if(!tr)return;
  const i=tr.dataset.i, det=document.querySelector('tr.det[data-i="'+i+'"]');
  if(!det)return; const willOpen=det.hidden; det.hidden=!willOpen; tr.classList.toggle('open',willOpen);
});
calc();
</script>
